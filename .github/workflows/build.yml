name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.OMNICODE_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > debug.keystore
            echo "Signing key restored"
          else
            echo "WARNING: secret OMNICODE_KEYSTORE_B64 is not set, using random debug key"
          fi

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.7 --no-daemon

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OmniCode-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
